name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --editor --quit
          godot --headless --path . --export-debug "Android" build/StormGenerals-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StormGenerals-Android-APK
          path: build/StormGenerals-debug.apk
          if-no-files-found: error
