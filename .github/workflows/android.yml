name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  export-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build utilities
        run: |
          set -eux
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y curl unzip
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache curl unzip
          else
            echo "No supported package manager found"
            exit 1
          fi
      - name: Install Android export templates and signing key
        run: |
          set -eux
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$TEMPLATE_DIR" build
          TEMPLATE_URL="https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=export_templates.tpz&version=4.4.1"
          MIRROR_URL="https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"
          if ! curl -fL --connect-timeout 20 --max-time 600 --retry 5 --retry-all-errors --retry-delay 2 -C - -o /tmp/godot-templates.tpz "$TEMPLATE_URL"; then
            echo "Official download failed; trying the Godot builds release mirror"
            curl -fL --connect-timeout 20 --max-time 600 --retry 5 --retry-all-errors --retry-delay 2 -C - -o /tmp/godot-templates.tpz "$MIRROR_URL"
          fi
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/lib/android-sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/cmdline-tools/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "Installed Android SDK packages:"
          find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf "%f\\n" || true
          find "$ANDROID_HOME/platforms" -mindepth 1 -maxdepth 1 -type d -printf "%f\\n" || true
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" || true
          ls -la /opt/android-sdk || true
          keytool -genkeypair -noprompt -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/tmp/debug.keystore
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          godot --headless --path . --editor --quit --verbose
          godot --headless --path . --export-debug "Android" build/StormGenerals-debug.apk --verbose
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StormGenerals-Android-APK
          path: build/StormGenerals-debug.apk
          if-no-files-found: error
