name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Android export templates and signing key
        run: |
          set -eux
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$TEMPLATE_DIR" build
          curl -L --fail --retry 3 -o /tmp/godot-templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/lib/android-sdk}"
          keytool -genkeypair -noprompt -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/tmp/debug.keystore
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          godot --headless --path . --editor --quit
          godot --headless --path . --export-debug "Android" build/StormGenerals-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StormGenerals-Android-APK
          path: build/StormGenerals-debug.apk
          if-no-files-found: error
