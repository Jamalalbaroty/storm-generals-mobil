name: Godot Validation

on:
  pull_request:
    branches: [main]
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.tres'
      - 'project.godot'
      - '.github/workflows/validation.yml'
  push:
    branches: [main]
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.tres'
      - 'project.godot'
      - '.github/workflows/validation.yml'
  workflow_dispatch:

concurrency:
  group: storm-generals-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4.4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: false
      - name: Import project resources
        run: godot --headless --path . --editor --quit --verbose
      - name: Smoke test active game scene
        shell: bash
        run: |
          godot --headless --path . --quit-after 3 --verbose > /tmp/main-smoke.log 2>&1
          cat /tmp/main-smoke.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" /tmp/main-smoke.log; then
            echo "Main scene smoke test failed"
            exit 1
          fi
      - name: Smoke test isolated 3D battlefield
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 180s godot --headless --path . --script res://prototype_3d/smoke_test.gd 2>&1 | tee /tmp/3d-smoke.log
          smoke_status=${PIPESTATUS[0]}
          if [ "$smoke_status" -ne 0 ]; then
            echo "3D battlefield smoke test exited with status $smoke_status"
            exit "$smoke_status"
          fi
          if grep -E "ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script|ObjectDB instances leaked" /tmp/3d-smoke.log; then
            echo "3D battlefield smoke test reported engine or script errors"
            exit 1
          fi
      - name: Smoke test live 2D-to-3D gameplay bridge
        shell: bash
        run: |
          godot --headless --path . --script res://prototype_3d/live_bridge_smoke_test.gd --verbose > /tmp/live-bridge-smoke.log 2>&1
          cat /tmp/live-bridge-smoke.log
          if grep -E "ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script|ObjectDB instances leaked" /tmp/live-bridge-smoke.log; then
            echo "Live gameplay bridge smoke test reported engine or script errors"
            exit 1
          fi
      - name: Smoke test gameplay economy and AI recovery
        shell: bash
        run: |
          set +e
          godot --headless --path . --script res://tests/gameplay_economy_smoke_test.gd --verbose > /tmp/gameplay-smoke.log 2>&1
          gameplay_status=$?
          set -e
          cat /tmp/gameplay-smoke.log
          if [ "$gameplay_status" -ne 0 ]; then
            echo "Gameplay smoke test exited with status $gameplay_status"
            exit "$gameplay_status"
          fi
          if grep -E "ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script|ObjectDB instances leaked" /tmp/gameplay-smoke.log; then
            echo "Gameplay smoke test reported engine or script errors"
            exit 1
          fi
      - name: Run long-match endurance simulation
        shell: bash
        run: |
          set +e
          godot --headless --path . --script res://tests/long_match_endurance_test.gd --verbose > /tmp/long-match.log 2>&1
          long_match_status=$?
          set -e
          cat /tmp/long-match.log
          if [ "$long_match_status" -ne 0 ]; then
            echo "Long-match endurance test exited with status $long_match_status"
            exit "$long_match_status"
          fi
          if grep -E "ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load script|ObjectDB instances leaked" /tmp/long-match.log; then
            echo "Long-match endurance test reported engine or script errors"
            exit 1
          fi
